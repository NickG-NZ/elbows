[project]
name = "elbows-hardware"
version = "0.1.0"
description = "Calibration procedures and robot setups for physical hardware"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware"]
