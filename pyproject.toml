[project]
name = "elbows"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["autoresearch[modal]"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["autoresearch"]
# Each autoresearch task is its own tiny uv project with pinned deps; keep them out of the workspace.
exclude = ["autoresearch/tasks/*"]

[tool.uv.sources]
autoresearch = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
