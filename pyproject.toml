[project]
name = "elbows"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["autoresearch[modal]", "elbows-sim[mujoco,video]", "elbows-learn"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["autoresearch", "elbows_sim", "elbows_learn"]
# Each autoresearch task is its own tiny uv project with pinned deps; keep them out of the workspace.
exclude = ["autoresearch/tasks/*"]

[tool.uv.sources]
autoresearch = { workspace = true }
elbows-sim = { workspace = true }
elbows-learn = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
# Autoresearch task code is agent-edited and partly hash-frozen; lint the harness, not the tasks.
extend-exclude = ["autoresearch/tasks"]
