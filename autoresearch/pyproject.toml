[project]
name = "autoresearch"
version = "0.1.0"
description = "Parallel, ledger-backed autoresearch loops (after karpathy/autoresearch)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
modal = ["modal>=1.0"]

[project.scripts]
ar = "autoresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]
